name: Verify Loopmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:compat
      - run: npm run test:security
      - run: npm run test:release:contracts
      - run: npm run test:sandbox:contracts
      - run: npm run test:native:evidence
      - run: npm run test:examples
      - run: npm run test:docs
      - run: npm run test:dx
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium --project=chromium-mobile
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=webkit --project=webkit-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - run: npm run test:ui -- ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.engine }}
          path: |
            test-results/
            test-results-ui/
            playwright-report/
  local-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOPMARK_DEV_PROFILE: ci
      LOOPMARK_DEV_APP_PORT: 56620
      LOOPMARK_DEV_API_PORT: 56621
      LOOPMARK_DEV_DB_PORT: 56622
      LOOPMARK_DEV_STUDIO_PORT: 56623
      LOOPMARK_DEV_MAIL_PORT: 56624
      LOOPMARK_SYNC_PUBLIC_ENV: .env.local
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run local:up -- --billing-fixture
      - run: npm run test:server
      - run: npm run test:sync -- --project=chromium
      - run: npm run local:down
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-sync-browser-results
          path: test-results-sync/
